[project]
name = "dataquery-cnpj"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ronaldo Guimarães", email = "ronaldo.bguimaraes@outlook.com" }
]
requires-python = ">=3.15"
dependencies = [
    "aiohttp>=3.14.5",
    "boto3>=1.43.120",
    "duckdb>=2.0.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "psutil>=7.2.2",
    "pyarrow>=26.0.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "webdavclient3>=3.14.7",
]

[project.scripts]
dataquery-cnpj = "dataquery_cnpj:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
