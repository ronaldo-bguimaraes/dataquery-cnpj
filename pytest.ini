[pytest]
testpaths = tests
asyncio_mode = auto
pythonpath = .
addopts = -p no:cacheprovider
markers =
    network: requires RUN_NETWORK_TESTS=1 and network access to the RFB WebDAV
    integration: requires a PostgreSQL test database
    e2e: requires Playwright and a running query web app
    perf: performance benchmark, not run by default
